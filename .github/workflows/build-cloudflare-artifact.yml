name: Build Cloudflare deployment artifact

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - '.github/workflows/build-cloudflare-artifact.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        run: npm run build-web
      - name: Bundle Worker without deploying
        run: npx wrangler deploy --dry-run --outdir ./worker-bundle --minify
      - name: List artifact file names
        run: find worker-bundle public -maxdepth 2 -type f | head -35
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-openlist-apis
          path: |
            worker-bundle/
            public/
            wrangler.jsonc
          if-no-files-found: error
          retention-days: 14
